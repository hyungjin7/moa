name: MOA checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/llm.test.mjs tests/document-editor.test.mjs
      - run: npm run test:oidc
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
