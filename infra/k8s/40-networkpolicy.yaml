apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moa
  namespace: moa
spec:
  podSelector:
    matchLabels:
      app: moa
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 5001
