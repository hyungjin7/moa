apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moa
  namespace: moa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [moa.delvrio.com]
      secretName: moa-tls
  rules:
    - host: moa.delvrio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moa
                port:
                  number: 5001
